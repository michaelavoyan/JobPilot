<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JobPilot</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header>
  <div class="brand">
    <span class="mark">JP</span>
    <div>
      <h1>JobPilot</h1>
      <p id="subtitle">find your next role</p>
    </div>
  </div>
  <div class="pills" id="pills"></div>
</header>

<main>
  <section class="wizard">
    <div class="step">
      <h2>Your CV</h2>
      <label id="drop" class="drop" for="cv">
          <input id="cv" type="file" accept=".pdf,.docx,.md,.markdown" />
          <strong id="dropTitle">Drop your CV here, or click to choose</strong>
        <span class="muted">PDF, DOCX or Markdown</span>
      </label>
      <p id="cvStatus" class="note"></p>
    </div>

    <div class="step">
      <h2>What</h2>
      <select id="field" aria-label="Field"></select>
    </div>

    <div class="step">
      <h2>Where</h2>
      <select id="market" aria-label="Country"></select>
      <p id="marketStatus" class="note"></p>
    </div>

    <div class="step">
      <h2>Companies</h2>
      <div class="inline">
        <input id="companyUrl" type="text" placeholder="https://jobs.lever.co/acme" />
        <button id="addCompany" class="ghost">Add</button>
      </div>
      <p id="companiesNote" class="note"></p>
      <button id="findCompanies" class="ghost" hidden>Find more companies</button>
    </div>

    <div class="step">
      <h2>Also open to <span class="opt">optional</span></h2>
      <div id="tokenField" class="tokenfield">
        <input id="interestInput" type="text" placeholder="e.g. platform engineering, developer tooling" />
      </div>
    </div>

    <button id="search" class="primary big" disabled>Find jobs</button>
    <p id="searchStatus" class="note"></p>
  </section>

  <section class="results">
    <div class="results-head">
      <h2>Matches</h2>
      <div class="inline">
        <label class="tiny-label" for="filterMin">min score</label>
        <input id="filterMin" type="number" min="0" max="100" value="65" class="tiny" />
        <button id="refresh" class="ghost">Refresh</button>
      </div>
    </div>
    <p id="resultsHint" class="note"></p>
    <div id="jobs"></div>

    <details id="hiddenBox" class="hidden-jobs" hidden>
      <summary id="hiddenSummary">Hidden</summary>
      <div id="hiddenList"></div>
    </details>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
