# Target companies. This file is the input that actually determines quality.
# 150 well-chosen companies beats every aggregator.
#
# Add entries with:   npm run discover -- <careers-page-url>
# or write them by hand:
#
#   companies:
#     - { name: "Acme", source: greenhouse, slug: "acme" }
#     - { name: "Acme", source: lever,      slug: "acme" }
#     - { name: "Acme", source: ashby,      slug: "acme" }
#     - { name: "Acme", source: comeet,     uid: "30.005", token: "ABC123" }
#
# Comeet needs BOTH uid and token. Both are public in the company's careers
# page source; `npm run discover` tries to extract them for you.

companies: []
