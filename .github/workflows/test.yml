name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The check the branch protection requires. It runs the floor declared in
  # package.json, so a break on the oldest supported Node cannot ship.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Runs the compiler first, then the suite.
      - run: npm test

  # The current release line, so a change that only breaks on the newest Node
  # is visible before it reaches a user. Not a required check: the floor is the
  # promise, this is the early warning.
  test-next:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci
      - run: npm test

  # Trunk-based guidance, not a gate: a change that cannot be reviewed in one
  # sitting is usually two changes. Reported on the PR summary; never blocks.
  size:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Measure the diff
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          stats="$(git diff --numstat "origin/${{ github.base_ref }}...HEAD" -- . \
            ':(exclude)*.lock' ':(exclude)tests/**' ':(exclude)docs/**')"
          lines="$(printf '%s\n' "$stats" | awk 'NF==3 {a+=$1; d+=$2} END {print a+d+0}')"
          echo "### PR size: ${lines} changed lines" >> "$GITHUB_STEP_SUMMARY"
          echo "Tests, lockfiles and docs excluded. Trunk-based guidance: about 400 or fewer." >> "$GITHUB_STEP_SUMMARY"
          if [ "$lines" -gt 400 ]; then
            echo "::warning title=Large PR::${lines} changed lines excluding tests, lockfiles and docs; guidance is about 400"
          fi

  # Advisory: a new high-severity advisory in a runtime dependency should be
  # visible on the PR that touches the lockfile, without blocking unrelated
  # work. The required check stays `test`.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
